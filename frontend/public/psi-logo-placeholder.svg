<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" role="img" aria-labelledby="title desc">
  <title id="title">PSI Placeholder Logo</title>
  <desc id="desc">Placeholder circular logo with PSI initials.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f3155"/>
      <stop offset="100%" stop-color="#2f7cb2"/>
    </linearGradient>
  </defs>
  <circle cx="110" cy="110" r="102" fill="url(#bg)"/>
  <circle cx="110" cy="110" r="90" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4"/>
  <text x="110" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff">PSI</text>
</svg>
