server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The app shell must never be reused from the browser cache. In production an
    # upstream firewall injects a per-request security token into this page; a
    # cached copy (served directly or after a 304 revalidation) carries a stale
    # token and the app's API requests then fail until a hard refresh (Ctrl+F5).
    # Also makes a new deployment visible on the next normal page load.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        etag off;
        if_modified_since off;
    }

    # Vite emits content-hashed file names here, so they can be cached for good.
    # A missing asset is a real 404 instead of falling back to index.html.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Serve the SPA - fall back to index.html for client-side routing
    # (the fallback is an internal redirect, so it gets the no-store rule above).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
