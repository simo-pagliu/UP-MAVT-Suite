server {
    listen 80;
    server_name summer-project-selection-test.psi.ch;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name summer-project-selection-test.psi.ch;
    
    ssl_certificate /etc/nginx/certs/summer-project-selection-test.psi.ch.crt;
    ssl_certificate_key /etc/nginx/private/summer-project-selection-test.psi.ch.key;

    location / {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://summer-project-selection:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
