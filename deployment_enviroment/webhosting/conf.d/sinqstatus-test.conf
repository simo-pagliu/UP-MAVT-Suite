server {
    listen 80;
    server_name sinqstatus-test.psi.ch;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name sinqstatus-test.psi.ch;

    root /opt/webcontent/sinqstatus-test;
    index index.html;

    ssl_certificate     /etc/nginx/certs/sinqstatus-test.psi.ch.crt;
    ssl_certificate_key /etc/nginx/private/sinqstatus-test.psi.ch.key;

    access_log /var/log/nginx/sinqstatus-test.access.log;
    error_log  /var/log/nginx/sinqstatus-test.error.log;

    location / {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;

        try_files $uri $uri/ =404;
    }
}

