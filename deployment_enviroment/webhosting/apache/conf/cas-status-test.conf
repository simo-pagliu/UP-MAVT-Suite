<VirtualHost *:80>
    ServerName cas-status-test.psi.ch
    DocumentRoot /var/www/cas-status/web

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined

    Header set Access-Control-Allow-Origin "*"

    # PHP configuration
    <FilesMatch ".+\.ph(p[345]?|t|tml)$">
        SetHandler application/x-httpd-php
    </FilesMatch>

    php_admin_value upload_tmp_dir /var/www/clients/client45/web70/tmp
    php_admin_value session.save_path /var/www/clients/client45/web70/tmp
    php_admin_value open_basedir /var/www/clients/client45/web70/web:/var/www/clients/client45/web70/private:/var/www/clients/client45/web70/tmp:/var/www/cas-status/web:/tmp:/usr/share/php:/usr/share/phpmyadmin:/etc/phpmyadmin:/var/lib/phpmyadmin:/var/www/error/

    <Directory /var/www/cas-status/web>
        Options +FollowSymLinks +Includes
        AllowOverride All
        Require all granted

        # SSI support
        AddType text/html .shtml
        AddOutputFilter INCLUDES .shtml
    </Directory>

</VirtualHost>

