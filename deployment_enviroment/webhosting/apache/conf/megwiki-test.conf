<VirtualHost *:80>
    ServerName megwiki-test.psi.ch
    DocumentRoot /var/www/megwiki

    <Directory /var/www/megwiki>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog  /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>

