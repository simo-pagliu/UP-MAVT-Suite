server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 404;

}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/certs/default00.psi.ch.crt;
    ssl_certificate_key /etc/nginx/private/default00.psi.ch.key;

    return 404;
}

