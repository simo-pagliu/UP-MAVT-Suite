version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: elicitation-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: elicitation
    volumes:
      - mongo_data:/data/db
    networks:
      - elicitation-network

  backend:
    build: ./backend
    container_name: elicitation-backend
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://mongo:27017/elicitation
      FLASK_ENV: development
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    depends_on:
      - mongo
    volumes:
      - ./backend:/app
    networks:
      - elicitation-network

  worker:
    build: ./worker
    container_name: elicitation-worker
    environment:
      MONGO_URI: mongodb://mongo:27017/elicitation
    depends_on:
      - mongo
    volumes:
      - ./worker:/app
    networks:
      - elicitation-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: elicitation-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - elicitation-network

volumes:
  mongo_data:

networks:
  elicitation-network:
    driver: bridge
