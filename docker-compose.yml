services:
  mongo:
    image: mongo:7.0
    container_name: elicitation-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: elicitation
    volumes:
      - mongo_data:/data/db
    networks:
      - elicitation-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: elicitation-backend
    ports:
      - "5000:5000"
    # env_file:
    #   - .env
    environment:
      APP_BASE_URL: http://localhost:3000
      MONGO_URI: mongodb://mongo:27017/elicitation
      FLASK_ENV: development
      ADMIN_PASSWORD: admin123 #${MCDA_UP_ADMIN_PASSWORD}
      DISABLE_EMAIL: true
      # OAUTH2_CLIENT_SECRET: ${MCDA_UP_OAUTH2_SECRET}
      # File-based secret fallback (uncomment to use mounted secret files):
      # ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      # OAUTH2_CLIENT_SECRET_FILE: /run/secrets/oauth2_client_secret
    depends_on:
      - mongo
    volumes:
      - ./backend:/app
      - ./frontend/public:/frontend/public:ro
      - ./worker/scripts:/worker/scripts:ro
    networks:
      - elicitation-network

  worker:
    build: ./worker
    container_name: elicitation-worker
    environment:
      MONGO_URI: mongodb://mongo:27017/elicitation
    depends_on:
      - mongo
    volumes:
      - ./worker:/app
    networks:
      - elicitation-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: elicitation-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - elicitation-network

volumes:
  mongo_data:

networks:
  elicitation-network:
    driver: bridge
